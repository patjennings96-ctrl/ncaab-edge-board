# Refreshes the board on a schedule and commits the new card.
#
# Two schedules (times are UTC):
#   * Morning run, every day at 12:15 UTC: pull new results, refit ratings,
#     price the slate.
#   * Line refreshes at 16:15, 19:15, 22:15 and 00:15 UTC: re-price as lines
#     move. These only run when MODEL_MODE is "live".
#
# Odds API cost: 2 credits per run x 5 runs/day = ~300 credits/month, which fits
# a 500-credit monthly plan. Add times to the second cron only if your plan allows more.
#
# Repo settings this workflow reads (Settings -> Secrets and variables -> Actions):
#   Variables: MODEL_MODE ("demo" or "live"), SHEET_ID (optional)
#   Secrets:   ODDS_API_KEY (live mode), GOOGLE_CREDS (optional, service-account JSON)

name: Refresh board

on:
  schedule:
    - cron: "15 12 * * *"
    - cron: "15 0,16,19,22 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-board
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 90        # the first live run backfills a full season
    env:
      MODEL_MODE: ${{ vars.MODEL_MODE || 'demo' }}
      SHEET_ID: ${{ vars.SHEET_ID }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
    steps:
      - name: Decide whether to run
        id: gate
        run: |
          if [ "${{ github.event.schedule }}" = "15 0,16,19,22 * * *" ] && [ "$MODEL_MODE" != "live" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Hourly odds refresh skipped: MODEL_MODE is not live."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install -r requirements.txt

      - name: Write Google credentials
        if: steps.gate.outputs.run == 'true' && env.GOOGLE_CREDS != ''
        run: printf '%s' "$GOOGLE_CREDS" > "$RUNNER_TEMP/credentials.json"

      - name: Run model
        if: steps.gate.outputs.run == 'true'
        env:
          GOOGLE_CREDS_PATH: ${{ runner.temp }}/credentials.json
        run: |
          cd src
          if [ "$MODEL_MODE" = "live" ]; then
            python run_daily.py --live
          else
            python run_daily.py
          fi

      - name: Commit updated card
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "board-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Refresh board $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase -X theirs origin main
            git push
          fi
